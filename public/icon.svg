<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Energy Pentagram Geometry -->
  <g transform="translate(256,256) scale(0.85)">
    <!-- Outer Arc Ring -->
    <circle r="190" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="14 8" opacity="0.4"/>
    <circle r="170" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

    <!-- Central Diamond Shield -->
    <path d="M 0 -130 L 125 0 L 0 130 L -125 0 Z" fill="#0369a1" fill-opacity="0.25" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)"/>
    <path d="M 0 -95 L 90 0 L 0 95 L -90 0 Z" fill="#0284c7" fill-opacity="0.2" stroke="#bae6fd" stroke-width="3"/>

    <!-- Center Rune / Die / Swords Motif -->
    <path d="M 0 -55 L 45 -25 L 45 35 L 0 65 L -45 35 L -45 -25 Z" fill="#0f172a" stroke="url(#amberGrad)" stroke-width="6"/>
    <line x1="0" y1="-55" x2="0" y2="65" stroke="url(#amberGrad)" stroke-width="4"/>
    <line x1="-45" y1="-25" x2="45" y2="35" stroke="url(#amberGrad)" stroke-width="3" opacity="0.7"/>
    <line x1="45" y1="-25" x2="-45" y2="35" stroke="url(#amberGrad)" stroke-width="3" opacity="0.7"/>

    <!-- Five Energy Nodes -->
    <circle cx="0" cy="-170" r="14" fill="#3b82f6" stroke="#93c5fd" stroke-width="3"/> <!-- Mana -->
    <circle cx="162" cy="-52" r="14" fill="#f97316" stroke="#fdba74" stroke-width="3"/> <!-- Aura -->
    <circle cx="100" cy="138" r="14" fill="#ef4444" stroke="#fca5a5" stroke-width="3"/> <!-- Física -->
    <circle cx="-100" cy="138" r="14" fill="#eab308" stroke="#fef08a" stroke-width="3"/> <!-- Prana -->
    <circle cx="-162" cy="-52" r="14" fill="#94a3b8" stroke="#e2e8f0" stroke-width="3"/> <!-- Neutra -->
  </g>
</svg>
